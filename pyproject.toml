[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-v2"
version = "2.1.0"
description = "Windows desktop vocabulary trainer: floating-widget capture plus native writing drill, backed by an Excel master file."
requires-python = ">=3.12"

dependencies = [
    # UI: Qt widgets for the transparent overlay, QtWebEngine (QWebEngineView) for
    # the mockup-derived Practice and Settings windows. PySide6 pulls in
    # PySide6-Addons, which is where QtWebEngine lives.
    "PySide6>=6.8,<6.12",
    # Excel master file.
    #
    # openpyxl only, no pandas. The recorded decision was "pandas for reading plus
    # openpyxl for writing", but the repository needs cell-level access on two sheets
    # to repair header rows in place, preserve user-added columns, and delete
    # individual rows -- none of which a DataFrame round-trip expresses without
    # rewriting whole sheets. pandas ended up imported nowhere, so declaring it would
    # add a heavy build-from-source dependency for no benefit. See README.
    "openpyxl>=3.1,<4",
    # Dictionary and translation lookups.
    "httpx>=0.27,<1",
    # Master-file external-change watching. Optional at runtime: the watcher falls
    # back to polling when this is absent.
    "watchdog>=4,<7",
    # Text-to-speech via SAPI5. Version floor rather than a pin so the wheel resolves
    # across Python versions -- pywin32 publishes per-interpreter builds and an exact
    # pin breaks on any interpreter it does not target.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
]

[project.scripts]
vocab-v2 = "vocabulary_trainer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocabulary_trainer = [
    "assets/**/*",
    "assets/dictionary/*.json",
    "ui/theme/*.qss",
    "ui/theme/*.css",
    "ui/web/**/*.html",
    "ui/web/**/*.js",
    "ui/web/**/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests" is on the path so test modules can import the shared fakes from
# tests/conftest.py directly, without making the test directories packages.
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.coverage.run]
source = ["vocabulary_trainer"]
omit = [
    # UI modules require live Windows compositing and installed voices, so they
    # are verified by launching the app rather than by unit tests. Business logic is
    # deliberately kept out of these modules (NFR-TEST-01).
    #
    # Note: coverage is reported for information only. The former 80% minimum
    # (NFR-TEST-02) was withdrawn by explicit user instruction -- new tests are
    # written only when asked for. See PROJECT.md section 4.2.
    "*/ui/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
